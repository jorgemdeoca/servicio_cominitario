<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Sistema de Gestión Escolar</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <!-- L1: Logo institucional o placeholder -->
        <div class="login-logo-placeholder" id="loginLogo">
          <img src="/icons/graduation-cap.svg" alt="" style="width:36px;height:36px;opacity:0.5;">
        </div>
        <p class="login-ministry">República Bolivariana de Venezuela<br>Ministerio del Poder Popular para la Educación</p>
        <h1>U.E.E. "General Aquilino Juáres"</h1>
        <p class="login-subtitle">Sistema de Gestión de Matrícula Escolar</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="nombre_usuario">Usuario</label>
          <!-- L2: Input con icono SVG -->
          <div class="input-icon-wrap">
            <img src="/icons/user.svg" alt="" class="input-icon">
            <input type="text" id="nombre_usuario" name="nombre_usuario" required autocomplete="username" placeholder="Ingrese su usuario">
          </div>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-icon-wrap">
            <img src="/icons/lock.svg" alt="" class="input-icon">
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Ingrese su contraseña">
          </div>
        </div>
        <div id="loginError" class="alert alert-error" style="display:none;"></div>
        <!-- L3: Botón con soporte loading -->
        <button type="submit" class="btn btn-primary btn-full" id="btnLogin">
          Iniciar Sesión
        </button>
      </form>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
